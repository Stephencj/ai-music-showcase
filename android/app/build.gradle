plugins {
    id 'com.android.application' version '8.7.2'
}

// Release signing config from a gitignored keystore.properties (KEEP SAFE —
// losing the keystore means you can't update the published app).
def ksProps = new Properties()
def ksFile = rootProject.file('keystore.properties')
if (ksFile.exists()) ksProps.load(new FileInputStream(ksFile))

android {
    namespace 'com.aimusic'
    compileSdk 34

    defaultConfig {
        applicationId 'com.aimusic'
        minSdk 24
        targetSdk 34
        versionCode 12
        versionName '1.11'
        manifestPlaceholders = [appLabel: 'Music Producer']
    }

    buildFeatures {
        buildConfig true
    }

    // Two apps from one project: `producer` (the live-from-Mac Music Producer)
    // and `dressup` (a standalone OFFLINE "Dress Up Band" that loads bundled
    // web assets — no Mac, no network). Build with assembleProducerDebug /
    // assembleDressupDebug (or *Release).
    flavorDimensions += 'mode'
    productFlavors {
        producer {
            dimension 'mode'
            buildConfigField 'boolean', 'STANDALONE', 'false'
        }
        dressup {
            dimension 'mode'
            applicationIdSuffix '.dressup'
            versionNameSuffix '-dressup'
            buildConfigField 'boolean', 'STANDALONE', 'true'
            manifestPlaceholders = [appLabel: 'Dress Up Band']
        }
    }

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile rootProject.file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksFile.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // WebViewAssetLoader (serve bundled web over a virtual https origin) +
    // addDocumentStartJavaScript (inject the API base before the app runs).
    implementation 'androidx.webkit:webkit:1.11.0'
}
