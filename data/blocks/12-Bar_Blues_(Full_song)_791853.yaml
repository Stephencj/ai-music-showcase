lyrics: "Mm, well, let me tell you what\n\nI was gazing up at heaven, counting every\
  \ shining star\nYeah I stared up at that heaven, thinking how blest we are\nWe laughed\
  \ about the good times, talked about how far we'd come\nThen I tipped my hat goodnight\
  \ and turned to head on\n\nNow hold on \u2014 where in the world did I park my car?\n\
  I've been wandering this parking lot, near and far\nHeaven gave me everything, but\
  \ it won't say where's my car\n\nMaybe angels took it for a joyride through the\
  \ night\nOr I'm just a dreamer who lost his ride by the pale moonlight\n\nLord,\
  \ I still can't find my car"
