lyrics: "[Intro]\nOh-oh, oh-oh-oh\n\n[Verse 1]\nCity lights are bleeding out on broken\
  \ glass,\nI count my scars like mile markers in the dark.\nEverybody swore the fire\
  \ wouldn't last,\nbut I kept a spark alive inside my chest.\nI've been down on the\
  \ floor where the silence gets loud,\nreaching for a morning I could not see now.\n\
  \n[Pre-chorus]\nAnd when the night lies heavy on my chest,\nI whisper back the promise\
  \ that I kept \u2014\n\n[Chorus 1]\n'Cause dreams don't cry tears of blood,\nthey\
  \ just rise like a flood \u2014 lift me up, lift me up.\nWhen the whole world says\
  \ enough,\nI'll keep dreaming out loud,\ndreams don't cry tears of blood.\n\n[Verse\
  \ 2]\nI traded all my quiet for a louder kind of brave,\nleft my fear like footprints\
  \ on a road I never saved.\nEvery closing door's a window I can climb \u2014\nI'm\
  \ one heartbeat away from the other side.\n\n[Bridge]\nLet it break, let it burn,\
  \ let it bend,\nI'm not afraid of where this road might end.\nHold the light, hold\
  \ the line, hold on,\nhold on...\n\n[Chorus 2]\n'Cause dreams don't cry tears of\
  \ blood,\nthey just rise like a flood \u2014 lift me up, lift me up.\nWhen the whole\
  \ world says enough,\nI'll keep dreaming out loud,\ndreams don't cry tears of blood.\n\
  \n[Outro]\nDreams don't cry, dreams don't cry...\n"
