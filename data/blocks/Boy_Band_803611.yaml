lyrics: 'Oh, oh, oh yeah, here we go,

  You said forever, then you turned and walked away,

  Left me with nothing but the lies you used to say.

  You broke my heart, so baby, now just go away,

  I''m done with crying over every yesterday.

  Take back the love you gave, I don''t need it anymore,

  Don''t come knocking on my door.

  So go, go, go, just go away from me.'
