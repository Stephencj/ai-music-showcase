lyrics: 'Oh no

  Here it comes

  Woke at three a.m. with a deep and stabbing pain

  My heart was beating sideways and I thought I''d hit the drain

  I texted all my exes saying sorry for it all

  I crawled across the carpet and I waited for the fall

  I saw a white light glowing

  Heard a choir start to cry

  I thought that I was dying, said my final sweet goodbye

  Wrote it on my phone with a tear inside my eye

  Turns out it wasn''t heartbreak, wasn''t even my poor heart

  Oh I just needed to fart, I just needed to fart

  I called my weeping mother, said remember me with love

  She asked me what was hurting, I said everything above

  The doctor''s on the highway and I see the flashing light

  Then something deep inside me started rumbling in the night

  The nurses came in sprinting and they hooked me to a beep

  I told them tell my goldfish that I loved him oh so deep

  I thought that I was dying, said my final sweet goodbye

  Wrote it on my phone with a tear inside my eye

  Turns out it wasn''t heartbreak, wasn''t even my poor heart

  Oh I just needed to fart, I just needed to fart

  All the drama, all the tears, the eulogy I penned

  I had planned my whole dang funeral, the flowers and the hymn

  A symphony of agony came roaring from my end

  Oh I''m alive

  I''m alive

  And the bathroom''s not so fine

  Light a candle, start anew

  I just needed to fart, what a beautiful design'
