lyrics: 'Ooh, summertime


  Sun came up on Saturday, the city''s feeling fine

  You walked by in golden light and stole this heart of mine

  The radio was playing low, the ceiling fans were slow

  And baby when you looked at me, I felt the whole town glow


  It''s that summer sizzle, baby, burning up the street

  Got me melting like the sidewalk underneath my feet

  Turn the heat up higher, let the good times roll

  Summer sizzle, baby, you''re the fire in my soul


  We danced until the streetlights came and painted us in gold

  Your hand was warm inside of mine, we never felt the cold

  A little sweat, a little groove, the band was playing sweet

  Two hearts caught in the rhythm of that hot and heavy beat


  Oh, when the temperature is rising, I lose all my control

  Come a little closer now and let me lose my soul


  It''s that summer sizzle, baby, burning up the street

  Got me melting like the sidewalk underneath my feet

  Turn the heat up higher, let the good times roll

  Summer sizzle, baby, you''re the fire in my soul


  Ooh, that summer sizzle'
