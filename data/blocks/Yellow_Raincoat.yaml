lyrics: "You said you would stay, but the sky turned gray,\nPromises fade like the\
  \ forecast changed.\nNow I am standing here in the pouring tears,\nDrenched in the\
  \ mess of our wasted years.\nBut I wont drown in the sound of goodbye,\nI\u2019\
  ve got a light in the dark of the night\u2014\nYou left me out in the rain again,\n\
  But I\u2019ve got my yellow raincoat, my friend.\nWe could still dance through the\
  \ storm if we try,\nUnder the clouds, love wont die.\nOh-oh-oh, with my yellow raincoat\
  \ on,\nMaybe we\u2019ll find where we went wrong.\nEvery fight was a thunder crash,\n\
  Every silence just lightning flash.\nBut I\u2019m not scared of a little pain,\n\
  If it means we might find our way again.\nSo let\u2019s rewrite our story\u2019\
  s end,\nArmor up and let\u2019s pretend\u2014\nYou left me out in the rain again,\n\
