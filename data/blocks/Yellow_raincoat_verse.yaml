lyrics: "You said you would stay, but the sky turned gray,\nPromises fade like the\
  \ forecast changed.\nNow I am standing here in the pouring tears,\nDrenched in the\
  \ mess of our wasted years.\n\nBut I won\u2019t drown in the sound of goodbye,\n\
  I\u2019ve got a light in the dark of the night\u2014\n\nYou left me out in the rain\
  \ again,\nBut I\u2019ve got my yellow raincoat, my friend.\nWe could still dance\
  \ through the storm if we try,\nUnder the clouds, love won\u2019t die.\nOh-oh-oh,\
  \ with my yellow raincoat on,\nMaybe we\u2019ll find where we went wrong.\n\nEvery\
  \ fight was a thunder crash,\nEvery silence just lightning flash.\nBut I\u2019m\
  \ not scared of a little pain,\nIf it means we might find our way again.\n\nSo let\u2019\
  s rewrite our story\u2019s end,\nArmor up and let\u2019s pretend\u2014\n\nYou left\
  \ me out in the rain again,\nBut I\u2019ve got my yellow raincoat, my friend.\n\
  We could still dance through the storm if we try,\nUnder the clouds, love won\u2019\
  t die.\nOh-oh-oh, with my yellow raincoat on,\nMaybe we\u2019ll find where we went\
  \ wrong.\n\nOoh, it\u2019s not perfect, but it\u2019s enough,\nOoh, love is tough,\
  \ but so is us.\nZip it up, hold me tight,\nMaybe we\u2019ll make it through the\
  \ night.\n\nYou left me out in the rain again,\nBut I\u2019ve got my yellow raincoat,\
  \ my friend.\nWe could still dance through the storm if we try,\nUnder the clouds,\
  \ love won\u2019t die.\nOh-oh-oh, with my yellow raincoat on,\nMaybe we\u2019ll\
  \ find where we belong.\n\nYellow raincoat, keep me dry,\nMaybe we\u2019ll make\
  \ it\u2014let\u2019s try."
