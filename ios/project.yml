# XcodeGen spec for the AI Music iOS wrapper.
#
# Generate / regenerate the Xcode project:
#
#     brew install xcodegen   # one-time
#     cd ios
#     xcodegen
#     open AiMusic.xcodeproj
#
# Everything in this file is human-readable. The generated
# AiMusic.xcodeproj/ is intentionally gitignored — regenerate it from
# source on each clone.

name: AiMusic
options:
  bundleIdPrefix: com.stephencjuliano
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: "2WHH92R86T"    # Apple Development team (stephencjuliano@gmail.com)
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GENERATE_INFOPLIST_FILE: NO       # we ship a hand-written Info.plist
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  AiMusic:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AiMusic
        excludes:
          - "Preview Content/**/*.swift"   # preview-only, ship via DevelopmentAssetPaths
    resources:
      - path: AiMusic/Preview Content
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stephencjuliano.aimusic
        PRODUCT_NAME: AiMusic
        INFOPLIST_FILE: AiMusic/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"        # iPhone + iPad
        DEVELOPMENT_ASSET_PATHS: "\"AiMusic/Preview Content\""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_PREVIEWS: YES

schemes:
  AiMusic:
    build:
      targets:
        AiMusic: all
    run:
      config: Debug
    archive:
      config: Release
