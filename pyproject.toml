[project]
name = "ai-music"
version = "0.1.0"
description = "AI Music Generation Toolkit"
authors = [
    {name = "Stephen C. Juliano", email = "stephencjuliano@example.com"}
]
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.11.0",
    "torchaudio>=2.11.0",
    "numpy>=2.4.4",
    "librosa>=0.11.0",
    "pretty_midi>=0.2.11",
    "pyfluidsynth>=1.3.4",
    "pedalboard>=0.9.22",
    "soundfile>=0.13.1",
    "pydub>=0.25.1",
    "scipy>=1.17.1",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "jupyter>=1.0.0",
    "python-dotenv>=1.0.0",
    "click>=8.1.0",
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
    "gradio>=6.0",
    "zeroconf>=0.130",
    "music21>=9.1",
    "oemer>=0.1.5",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "ipython>=8.0.0",
]
musicgen = [
    "transformers>=4.30.0",
    "accelerate>=0.20.0",
]
audiocraft = ["audiocraft"]
riffusion = [
    "diffusers>=0.19.0",
    "transformers>=4.30.0",
]
stable_audio = ["diffusers>=0.19.0"]
ardour = ["python-osc>=1.8.0"]
reaper = ["python-osc>=1.8.0"]
api = [
    "openai>=1.0.0",
    "anthropic>=0.7.0",
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/stephencjuliano/ai-music"
Documentation = "https://github.com/stephencjuliano/ai-music/docs"
Repository = "https://github.com/stephencjuliano/ai-music.git"
Issues = "https://github.com/stephencjuliano/ai-music/issues"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]